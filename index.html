    <style>
      body {
        margin: 0;
        overflow: hidden;
        /* Dark base matches the app so there is no white flash before mount;
           the React App component takes over the background after that. */
        background: #000;
        font-family: 'Inter', sans-serif;
      }
      /* Inline loading placeholder (no external assets); React replaces the
         contents of #root on mount. */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #e8e8e8;
      }
      .app-loading-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
      }
      .app-loading-sub {
        font-size: 10px;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: #777;
      }
      .app-loading-bar {
        width: 168px;
        height: 2px;
        background: #262626;
        overflow: hidden;
      }
      .app-loading-bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #999;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loading-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      /* Perf stage 5: first-visit poster — a real capture of the default
         scene, shown instantly so LCP is the image paint rather than the
         first WebGL frame. The gate script in body only reveals it for
         first-time visitors without a share-link hash; the app crossfades
         it out on the 'kalokagathia:first-frame' event. If the app never
         starts (e.g. WebGL unavailable) the poster simply stays up. */
      #app-poster {
        /* Absolute (not fixed): on minimal test pages Chrome's LCP
           measurement ignored images inside fixed containers but credited
           the identical absolute one. On this page the image is ultimately
           not credited either way (the WebGL canvas never was, in any
           build) — the poster is kept for what it provably does: a
           first-time visitor sees the real default scene within ~1-2s
           instead of a black loading screen, and it stays up as a
           fallback if WebGL never starts. Investigation:
           PERF_ANALYSIS_20261114.md, stage 5. */
        position: absolute;
        inset: 0;
        z-index: 80;
        background: #000;
        transition: opacity 0.6s ease;
      }
      #app-poster.app-poster-done {
        opacity: 0;
        pointer-events: none;
      }
      #app-poster img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .app-poster-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      /* Custom scrollbar for the control panel — Phase 2: Noise values
         (4px / thumb #333 / hover #555, radius 2px) */
      html {
        scrollbar-width: thin;
        scrollbar-color: #333 transparent;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>

  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Loading Kalokagathia">
        <div class="app-loading-title">Kalokagathia</div>
        <div class="app-loading-bar"><span></span></div>
        <div class="app-loading-sub">Loading</div>
      </div>
    </div>
    <div id="app-poster" hidden>
      <img id="app-poster-img" alt="" />
      <div class="app-poster-label">Kalokagathia</div>
    </div>
    <script>
      (function () {
        var poster = document.getElementById('app-poster');
        var img = document.getElementById('app-poster-img');
        var show = false;
        try { show = !localStorage.getItem('kalokagathia.visited.v1'); } catch (e) { show = false; }
        if (show && /(^|[#&])(p|c)=/.test(location.hash)) show = false;
        // Embed mode (?embed=1, ultimate Wave 3): the poster is a
        // first-visit welcome for the full app; inside an iframe it
        // would only cover the host page's player, so never show it.
        if (show && /[?&]embed=1(?:&|$)/.test(location.search)) show = false;
        // Stream mode (?stream=1, Phase 8): same reasoning, sharper —
        // the poster is an opaque full-screen still, and an OBS
        // Browser Source must open on the live, transparent canvas.
        if (show && /[?&]stream=1(?:&|$)/.test(location.search)) show = false;
        if (!show) return;
        img.fetchPriority = 'high';
        img.src = window.matchMedia('(max-width: 899px)').matches
          ? '/poster-mobile.webp'
          : '/poster-desktop.webp';
        poster.hidden = false;
        var done = false;
        var startFade = function () {
          if (done) return;
          done = true;
          poster.classList.add('app-poster-done');
          // Keep the node in the DOM (invisible) after the fade: it is
          // only removed on the next user interaction, when LCP is
          // already final.
          window.setTimeout(function () { poster.style.visibility = 'hidden'; }, 900);
          var cleanup = function () { poster.remove(); };
          window.addEventListener('pointerdown', cleanup, { once: true });
          window.addEventListener('keydown', cleanup, { once: true });
        };
        window.addEventListener('kalokagathia:first-frame', function () {
          // Hold the poster at full opacity briefly before fading: the
          // main thread is saturated until the first frame, so the image's
          // first presented paint would otherwise coincide with the fade,
          // and Chrome's LCP measurement discounts an image whose first
          // paint is already mid-fade (verified empirically 2026-11-14
          // with blocked-main-thread test pages; a 700ms hold fixed it).
          window.setTimeout(startFade, 700);
        });
        window.addEventListener('pointerdown', startFade);
        window.addEventListener('keydown', startFade);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* PWA install is optional; the app works without it */
          });

    <!-- Studio Console bridge (additive, 2026-11-16) -->
    <script>
(function(){
'use strict';
/* ═══ Studio Console bridge for Kalokagathia (2026-11-16, additive) ═══
   Kalokagathia は monosphere.pages.dev (別オリジン) のため Studio の
   BroadcastChannel が届かない。代わりに Studio が iframe へ送る
   postMessage (console v2 と同形式) を受けて transport を反映する。
   送信元オリジンは varelser.github.io / varelser.pages.dev のみ許可。
   停止方式は他の映像アプリと同じ rAF ゲート。seed はアプリ側の状態に
   外部から触る手段がないため v1 では対象外 (アプリ側フックが次の段)。
   読み込み時に親へ hello を送り、Studio 側で橋渡しの存在を表示する。 */
var ALLOW={ 'https://varelser.github.io':1, 'https://varelser.pages.dev':1 };
var paused=false, fakeId=2000000000;
var held=new Map();
var origRAF=window.requestAnimationFrame.bind(window);
var origCAF=window.cancelAnimationFrame.bind(window);
window.requestAnimationFrame=function(cb){
  if(paused){ var id=++fakeId; held.set(id,cb); return id; }
  return origRAF(cb);
};
window.cancelAnimationFrame=function(id){
  if(held.has(id)){ held.delete(id); return; }
  return origCAF(id);
};
var badge=null, badgeTimer=null;
function showBadge(text, sticky){
  if(!badge){
    badge=document.createElement('div');
    badge.style.cssText='position:fixed;left:10px;bottom:10px;z-index:99999;pointer-events:none;background:rgba(10,10,10,.8);color:#eee;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 12px;font:11px/1.5 sans-serif;letter-spacing:.08em';
    document.body.appendChild(badge);
  }
  badge.textContent=text; badge.style.display='block';
  if(badgeTimer)clearTimeout(badgeTimer);
  if(!sticky)badgeTimer=setTimeout(function(){ badge.style.display='none'; },1400);
}
function setPaused(p){
  p=!!p; if(p===paused)return; paused=p;
  if(paused){ showBadge('STUDIO ■ 一時停止中', true); }
  else{
    var h=Array.from(held.values()); held.clear();
    for(var i=0;i<h.length;i++)origRAF(h[i]);
    showBadge('STUDIO ▶ 再開', false);
  }
}
window.__studioBridge={version:1,paused:function(){return paused;},held:function(){return held.size;}};
window.addEventListener('message',function(e){
  if(!ALLOW[e.origin])return;
  var m=e.data; if(!m||typeof m!=='object')return;
  if(m.app!=='studio'||m.type!=='console')return;
  if(m.transport==='stop')setPaused(true);
  else if(m.transport==='play')setPaused(false);
});
try{ if(window.parent&&window.parent!==window)window.parent.postMessage({app:'kalokagathia',type:'studio-bridge',version:1},'*'); }catch(err){}
})();

    </script>
  </body>
