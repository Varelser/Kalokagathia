<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalokagathia</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monosphere" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kalokagathia — Monosphere" />
    <meta property="og:title" content="Kalokagathia — Monosphere" />
    <meta name="description" content="モノクロ3DパーティクルのWebアプリ。750種のプリセットとモーションの自由配線、AIによるパラメータ調整。Monochrome 3D particle playground in the browser — 750 presets, free-wired motions, AI-assisted control." />
    <meta property="og:description" content="モノクロ3DパーティクルのWebアプリ。750種のプリセットとモーションの自由配線、AIによるパラメータ調整。" />
    <meta property="og:url" content="https://monosphere.pages.dev/" />
    <meta property="og:image" content="https://monosphere.pages.dev/catalog/thumbs/coverage-370-cube-fronds-20261109.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://monosphere.pages.dev/catalog/thumbs/coverage-370-cube-fronds-20261109.jpg" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        /* Dark base matches the app so there is no white flash before mount;
           the React App component takes over the background after that. */
        background: #000;
        font-family: 'Inter', sans-serif;
      }
      /* Inline loading placeholder (no external assets); React replaces the
         contents of #root on mount. */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #e8e8e8;
      }
      .app-loading-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
      }
      .app-loading-sub {
        font-size: 10px;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: #777;
      }
      .app-loading-bar {
        width: 168px;
        height: 2px;
        background: #262626;
        overflow: hidden;
      }
      .app-loading-bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #999;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loading-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      /* Custom scrollbar for the control panel — Phase 2: Noise values
         (4px / thumb #333 / hover #555, radius 2px) */
      html {
        scrollbar-width: thin;
        scrollbar-color: #333 transparent;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Loading Kalokagathia">
        <div class="app-loading-title">Kalokagathia</div>
        <div class="app-loading-bar"><span></span></div>
        <div class="app-loading-sub">Loading</div>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* PWA install is optional; the app works without it */
          });
        });
      }
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
